<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Air Quality Monitoring</title>

    <link href="bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="leaflet.css" />

    <script src="leaflet.js"></script>
    <script src="alpinejs@3.15.12.js" defer></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #f4f7fb;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      .main-wrapper {
        width: 100%;
        height: 100vh;
        padding: 18px;
      }

      .dashboard-card {
        width: 100%;
        height: 100%;
        background: white;
        border-radius: 22px;
        overflow: hidden;

        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);

        display: flex;
        flex-direction: column;
      }

      .topbar {
        padding: 18px 24px;

        border-bottom: 1px solid #ececec;

        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
      }

      .topbar h2 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .topbar p {
        margin: 0;
        color: #6b7280;
        font-size: 14px;
      }

      .legend-container {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;

        font-size: 13px;
      }

      .legend-box {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }

      .info-bar {
        padding: 14px 24px;

        background: #f9fafb;

        border-bottom: 1px solid #ececec;

        display: flex;
        flex-wrap: wrap;
        gap: 22px;
      }

      .info-item {
        font-size: 13px;
        color: #4b5563;
      }

      .info-item b {
        color: #111827;
      }

      #map {
        flex: 1;
        width: 100%;
      }

      .leaflet-popup-content {
        margin: 14px;
      }

      .popup-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .popup-row {
        margin-bottom: 6px;
        font-size: 14px;
      }

      .aqi-badge {
        padding: 5px 10px;
        border-radius: 999px;
        color: white;
        font-weight: bold;
        font-size: 12px;
      }

      @media (max-width: 768px) {
        body {
          overflow: auto;
        }

        .main-wrapper {
          height: auto;
          padding: 10px;
        }

        .dashboard-card {
          min-height: 100vh;
          height: auto;
        }

        #map {
          height: 75vh;
        }

        .topbar h2 {
          font-size: 22px;
        }
      }

      .ispu-marker {
        position: relative;
        width: 54px;
        height: 54px;
      }

      .ispu-pin {
        width: 54px;
        height: 54px;

        border-radius: 50% 50% 50% 0;

        transform: rotate(-45deg);

        border: 3px solid white;

        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .ispu-value {
        transform: rotate(45deg);

        font-size: 14px;
        font-weight: bold;

        color: white;

        text-align: center;

        width: 100%;
      }

      .ispu-value small {
        display: block;
        font-size: 9px;
        line-height: 1;
      }
    </style>
  </head>

  <body>
    <div class="main-wrapper" x-data="sensorMap()" x-init="init()">
      <div class="dashboard-card">
        <div class="topbar">
          <div>
            <h2>Air Quality Monitoring</h2>

            <p>
              Monitoring kualitas udara di Universitas Multimedia Nusantara •
              <span x-text="currentTime"></span>
            </p>
          </div>

          <div class="legend-container">
            <div class="legend-item">
              <div class="legend-box" style="background: #3cb371"></div>
              <span>Baik (0-50)</span>
            </div>

            <div class="legend-item">
              <div class="legend-box" style="background: #1e90ff"></div>
              <span>Sedang (51-100)</span>
            </div>

            <div class="legend-item">
              <div class="legend-box" style="background: #ffd700"></div>
              <span>Tidak Sehat (101-200)</span>
            </div>

            <div class="legend-item">
              <div class="legend-box" style="background: #ff4500"></div>
              <span>Sangat Tidak Sehat (201-300)</span>
            </div>

            <div class="legend-item">
              <div class="legend-box" style="background: #8b0000"></div>
              <span>Berbahaya (>300)</span>
            </div>
          </div>
        </div>

        <div class="info-bar">
          <div class="info-item"><b>ISPU PM2.5:</b> Standar Indonesia</div>

          <div class="info-item"><b>CO₂ Normal:</b> 400 - 1000 ppm</div>

          <div class="info-item"><b>Suhu Ideal:</b> 24°C - 30°C</div>

          <div class="info-item"><b>Kelembapan Ideal:</b> 40% - 70%</div>
        </div>

        <div id="map"></div>
      </div>
    </div>

    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("sensorMap", () => ({
          map: null,
          markers: [],
          currentTime: "",
          hasFitBounds: false,

          async init() {
            this.updateCurrentTime();

            await this.$nextTick();

            this.initMap();

            await this.fetchMapData();

            setInterval(() => {
              this.updateCurrentTime();
            }, 1000);

            setInterval(async () => {
              await this.fetchMapData();
            }, 10000);
          },

          updateCurrentTime() {
            const now = new Date();

            this.currentTime = now.toLocaleString("id-ID", {
              hour: "2-digit",

              minute: "2-digit",

              second: "2-digit",

              day: "numeric",

              month: "long",

              year: "numeric",
            });
          },

          initMap() {
            if (this.map) {
              this.map.remove();

              this.map = null;
            }

            const mapContainer = document.getElementById("map");

            if (mapContainer._leaflet_id) {
              mapContainer._leaflet_id = null;
            }

            this.map = L.map("map", {
              zoomControl: true,
            }).setView([-6.2564, 106.6189], 13);

            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
              attribution: "&copy; OpenStreetMap",
            }).addTo(this.map);
          },

          async fetchMapData() {
            try {
              const res = await fetch("/api/v1/log/map");

              const json = await res.json();

              const data = json?.data || [];

              this.renderMarkers(data);
            } catch (err) {
              console.error("Map Error:", err);
            }
          },

          renderMarkers(data) {
            this.markers.forEach((m) => {
              this.map.removeLayer(m);
            });

            this.markers = [];

            const bounds = [];

            data.forEach((item) => {
              const lat = Number(item.latitude);

              const lng = Number(item.longitude);

              if (isNaN(lat) || isNaN(lng)) return;

              const aqi = this.calculateAQI(item.pm2_5);

              const color = this.getAQIColor(aqi);

              const category = this.getCategoryByAQI(aqi);

              const lastUpdate = new Date(item.timestamp).toLocaleString(
                "id-ID",
                {
                  day: "2-digit",

                  month: "short",

                  hour: "2-digit",

                  minute: "2-digit",

                  second: "2-digit",
                }
              );

              const customIcon = L.divIcon({
                className: "custom-ispu-marker",

                html: `
    <div class="ispu-marker">
      <div
        class="ispu-pin"
        style="background:${color}"
      >
        <div class="ispu-value">
          ${aqi}
          <small>ISPU</small>
        </div>
      </div>
    </div>
  `,

                iconSize: [54, 54],

                iconAnchor: [13, 40],

                popupAnchor: [0, -40],
              });

              const marker = L.marker([lat, lng], {
                icon: customIcon,
              }).addTo(this.map).bindPopup(`
                          <div style="min-width:240px">

                            <div class="popup-title">
                              Air Quality Monitoring
                            </div>

                            <div class="popup-row">
                              <b>AQI:</b>
                              ${aqi}
                            </div>

                            <div class="popup-row">
                              <b>Kategori:</b>

                              <span
                                class="aqi-badge"
                                style="background:${color}"
                              >
                                ${category}
                              </span>
                            </div>

                            <hr>

                            <div class="popup-row">
                              <b>PM1.0:</b>
                              ${item.pm1_0 ?? 0}
                            </div>

                            <div class="popup-row">
                              <b>PM2.5:</b>
                              ${item.pm2_5 ?? 0}
                              µg/m³
                            </div>

                            <div class="popup-row">
                              <b>PM10:</b>
                              ${item.pm10_0 ?? 0}
                            </div>

                            <div class="popup-row">
                              <b>Suhu:</b>
                              ${item.temperature ?? 0}
                              °C
                            </div>

                            <div class="popup-row">
                              <b>Kelembapan:</b>
                              ${item.humidity ?? 0}
                              %
                            </div>

                            <div class="popup-row">
                              <b>CO2:</b>
                              ${Math.round(item.co2 ?? 0)}
                              ppm
                            </div>

                            <hr>

                            <small>
                              Update terakhir:
                              ${lastUpdate}
                            </small>

                          </div>
                        `);

              this.markers.push(marker);

              bounds.push([lat, lng]);
            });

            if (bounds.length > 0) {
              if (bounds.length > 0 && this.markers.length === data.length) {
                if (!this.hasFitBounds) {
                  this.map.fitBounds(bounds, {
                    padding: [80, 80],
                  });

                  this.hasFitBounds = true;
                }
              }
            }
          },

          calculateAQI(pm25) {
            pm25 = Number(pm25 || 0);

            let Ihi, Ilo, BPhi, BPlo;

            if (pm25 <= 15.5) {
              Ihi = 50;
              Ilo = 0;
              BPhi = 15.5;
              BPlo = 0;
            } else if (pm25 <= 55.4) {
              Ihi = 100;
              Ilo = 51;
              BPhi = 55.4;
              BPlo = 15.5;
            } else if (pm25 <= 150.4) {
              Ihi = 200;
              Ilo = 101;
              BPhi = 150.4;
              BPlo = 55.4;
            } else if (pm25 <= 250.4) {
              Ihi = 300;
              Ilo = 201;
              BPhi = 250.4;
              BPlo = 150.4;
            } else {
              Ihi = 500;
              Ilo = 301;
              BPhi = 500.4;
              BPlo = 250.4;
            }

            return Math.round(
              ((Ihi - Ilo) / (BPhi - BPlo)) * (pm25 - BPlo) + Ilo
            );
          },

          getCategoryByAQI(ispu) {
            if (ispu <= 50) return "Baik";

            if (ispu <= 100) return "Sedang";

            if (ispu <= 200) return "Tidak Sehat";

            if (ispu <= 300) return "Sangat Tidak Sehat";

            return "Berbahaya";
          },

          getAQIColor(ispu) {
            if (ispu <= 50) return "#3CB371";

            if (ispu <= 100) return "#1E90FF";

            if (ispu <= 200) return "#FFD700";

            if (ispu <= 300) return "#FF4500";

            return "#8B0000";
          },
        }));
      });
    </script>
  </body>
</html>
