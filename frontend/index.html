<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Air Quality Monitoring</title>
    <!-- 1. HAPUS jsdelivr, GANTI DENGAN FILE LOKAL INI: -->
    <link href="bootstrap.min.css" rel="stylesheet" />

    <!-- 2. HAPUS jsdelivr, GANTI DENGAN FILE LOKAL INI: -->
    <script src="chart.umd.js"></script>
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <div class="row">
        <div class="col-12 text-center mb-4">
          <h1 class="fw-bold text-dark">💨 Dashboard Kualitas Udara</h1>
          <p class="text-secondary">
            Data Real-Time Terhubung via MQTT & MongoDB Atlas
          </p>
        </div>
      </div>

      <!-- Bagian Grafik -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card shadow-sm border-0 p-4">
            <h5 class="card-title fw-bold text-secondary mb-3">
              Grafik Sensor Terbaru
            </h5>
            <div style="position: relative; height: 300px; width: 100%">
              <canvas id="sensorChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Bagian Tabel Data -->
      <div class="row">
        <div class="col-12">
          <div class="card shadow-sm border-0 p-4">
            <h5 class="card-title fw-bold text-secondary mb-3">
              Log 20 Data Terakhir
            </h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-dark">
                  <tr>
                    <th scope="col">Waktu Terbaca</th>
                    <th scope="col">Nilai Sensor</th>
                    <th scope="col">Status</th>
                  </tr>
                </thead>
                <tbody id="tabel-sensor-body">
                  <tr>
                    <td colspan="3" class="text-center text-muted py-4">
                      Memuat data dari API backend...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Hubungkan ke Logika Javascript Frontend Anda -->
    <script src="script.js"></script>
  </body>
</html>
